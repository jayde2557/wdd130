<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rapids Rafting Company is the place to be. ONE OF THE BEST IN WHITEWATER RAFTING">
    <meta name="author" content="Jayden K. Baidoo">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | Rapids Rafting</title>
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo.jpeg" alt="logo">
            <span class="company-name">Rapids</span>
        </div>


        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Rapids Rafting Company</h1>
        <div class="contact-info">
            <p>123 Main River Street</p>
            <p>Kolob, California
            <p>+ 1 888 888 8888</p>
            <p>info@rapids.com</p>
        </div>

        <div class="contact-container">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3061.699944548419!2d-0.16407310962338753!3d5.635635698111585!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sgh!4v1764323159978!5m2!1sen!2sgh"
                    width="400" height="340" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="contact-form">
                <label for="username">Name:</label>
                <input type="text" id="username">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label>Message Purpose</label>
                <div class="radio-group">
                    <label><input type="radio" name="purpose"> General Inquiry</label>
                    <label><input type="radio" name="purpose"> Reservation Question</label>
                    <label><input type="radio" name="purpose"> Website Suggestion</label>
                </div>

                <label for="message">Message</label>
                <textarea placeholder="Type here..." id="message" name="message" rows="4"></textarea>

                <label><input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to the monthly
                    newsletter</label>

                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/raftemployee.jpg" alt="Rafting Group">
                <figcaption>Emily - Raft Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee1.jpg" alt="Red Raft">
                <figcaption>Katy - Custodial Department Head</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="River Ride">
                <figcaption>Luke - CEO</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>© 2025 | Rapids | Jayden Baidoo</p>
        <nav class="socialmedia">
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tiktok.png" alt="Tiktok Icon">
            </a>
            <a href="https://x.com">
                <img src="images/x-bw.png" alt="X Icon">
            </a>

        </nav>
    </footer>

</body>

</html>
